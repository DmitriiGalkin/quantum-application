function stateMarkup(){if(ui.state==='ready')return '';if(ui.state==='loading')return '<div role="status" class="state"><h2>Загружаем '+(ui.screen==='catalog'?'проекты':'встречи')+'…</h2><p>Собираем даты и места занятий.</p><div class="skeleton" aria-hidden="true"></div></div>';if(ui.state==='empty')return '<section class="state"><h2>'+(ui.screen==='catalog'?'Подходящих проектов пока нет':'Встреч пока нет')+'</h2><p>'+(ui.screen==='teacher'?'Запланируйте первое занятие для своего проекта.':'Посмотрите доступные проекты или вернитесь позже.')+'</p><button '+(ui.screen==='teacher'?'data-info="create"':'data-nav="catalog"')+'>'+(ui.screen==='teacher'?'Запланировать встречу':'Посмотреть проекты')+'</button></section>';return '<section class="state error" role="alert"><h2>Не удалось загрузить данные</h2><p>Попробуйте ещё раз. Ваши записи сохраняются.</p><button data-retry>Повторить</button></section>'}
function catalog(){return '<section class="heading hero"><div><p class="eyebrow">Бюро маленьких открытий</p><h1>Что создадим вместе?</h1><p>Проекты для детей, увлечённые преподаватели и встречи, на которых идеи становятся настоящими вещами.</p></div><span class="spark" aria-hidden="true">✦</span></section><div class="toolbar"><label class="search"><input id="search" type="search" aria-label="Поиск проектов" placeholder="Найти проект" value="'+escapeText(ui.search)+'"></label><select id="when" aria-label="Когда встреча"><option value="all">Все даты</option><option value="tomorrow">Завтра · 16 октября</option></select><select id="sort" aria-label="Сортировка"><option value="date">Ближайшие</option><option value="price">По цене</option></select></div><div id="catalog-results"></div><section class="banner"><div><h3>Любопытство — хорошее начало</h3><p>Сохраняйте интерес к новому и выбирайте, что хочется попробовать.</p></div><button data-info="ideas">Библиотека идей</button></section>'}
function updateCatalog(){const target=document.getElementById('catalog-results');if(!target)return;const when=document.getElementById('when'),sort=document.getElementById('sort');when.value=ui.when;sort.value=ui.sort;const state=stateMarkup();if(state){target.innerHTML=state;return}let rows=photos.filter(p=>(title(p)+' '+p.description+' '+name()+' '+place()).toLocaleLowerCase('ru').includes(ui.search.toLocaleLowerCase('ru'))&&(ui.when==='all'||p.id==='toy-005'));if(ui.sort==='price')rows=rows.toSorted((a,b)=>(a.price??Infinity)-(b.price??Infinity));target.innerHTML='<p class="count" role="status">Найдено проектов: '+rows.length+'</p><div class="cards">'+(rows.length?rows.map(card).join(''):'<div class="state"><h2>Ничего не найдено</h2><p>Попробуйте другое название или сбросьте условия.</p><button data-reset>Сбросить поиск и дату</button></div>')+'</div>'}
function student(){const p=photos[0];return '<section class="heading"><div><p class="eyebrow">Кабинет семьи · Алексей</p><h1>Завтра — новое открытие</h1><p>Ближайшая встреча и всё, что нужно для продолжения проекта.</p></div></section>'+(stateMarkup()||'<section class="next"><div class="next-info"><span class="tag">Ближайшая встреча · 16 октября</span><h2>'+escapeText(title(p))+'</h2><p class="time">11:00–12:30 МСК</p><div class="people"><p>'+escapeText(place())+'</p><p class="address">'+escapeText(address())+'</p><button data-info="teacher">Преподаватель: '+escapeText(name())+'</button></div><div class="actions"><button class="primary" data-project="'+p.id+'">Открыть встречу</button><button data-info="messages">Написать преподавателю</button></div></div>'+cover(p)+'</section><section class="notice"><div><strong>Ожидает оплаты · 900 ₽</strong><p>Перед оплатой проверьте дату, участника и место встречи.</p></div><button class="warm" data-info="payment">Проверить запись</button></section><div class="section-title"><h2>Мои проекты</h2><button class="quiet" data-nav="catalog">Найти новый проект →</button></div><div class="mini-list">'+photos.slice(1).map(p=>'<article class="mini"><h3>'+escapeText(title(p))+'</h3><p>'+(p.date||'Встречи уточняются')+'</p><button data-project="'+p.id+'">Посмотреть проект</button></article>').join('')+'</div>')}
function teacher(){return '<section class="heading"><div><p class="eyebrow">Кабинет преподавателя</p><h1>Расписание</h1><p>12–18 октября 2026 · московское время</p></div><button class="primary" data-info="create">+ Запланировать встречу</button></section><div class="week" aria-label="Дни недели">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>'<button class="day" data-day="'+(12+i)+'" aria-pressed="'+(12+i===ui.day)+'"><span>'+d+'</span><strong>'+(12+i)+'</strong><span class="dot" style="opacity:'+([16,17].includes(12+i)?1:0)+'"></span></button>').join('')+'</div><div class="schedule"><section><div class="section-title"><h2 id="day-heading">'+ui.day+' октября</h2><small id="event-count"></small></div><div class="agenda" id="agenda"></div></section><aside class="summary"><h3>На этой неделе</h3><dl><div><dt>Встречи</dt><dd>3</dd></div><div><dt>Участники встреч</dt><dd>18</dd></div></dl><p>Выберите день, чтобы проверить занятия, места и участников.</p></aside></div>'}
function updateAgenda(){const target=document.getElementById('agenda');if(!target)return;document.getElementById('day-heading').textContent=ui.day+' октября';document.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.day)===ui.day)));const rows=ui.day===16?photos.slice(0,2):ui.day===17?[photos[1]]:[];document.getElementById('event-count').textContent=ui.state==='ready'?'Встреч: '+rows.length:'';target.innerHTML=stateMarkup()||(rows.length?rows.map((p,i)=>'<article class="event"><div class="event-time"><strong>'+(i?'13:00':'11:00')+'</strong><small>90 минут</small></div><div><h3>'+escapeText(title(p))+'</h3><p><span class="tag success">Опубликована</span></p><p>'+escapeText(place())+' · мастерская</p><div class="event-bottom"><span>6 участников · '+money(p.price)+'</span><button data-project="'+p.id+'">Открыть встречу</button></div></div></article>').join(''):'<section class="state"><h3>Свободный день</h3><p>На этот день встреч пока нет.</p><button data-info="create">Запланировать встречу</button></section>')}
function render(){nav();document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===ui.screen)));main.innerHTML=({catalog,student,teacher})[ui.screen]()+'<footer class="foot"><span>Quantum · учиться, создавая</span><a href="../design-system.md">Правила дизайна</a><span>Демонстрационные даты и данные</span></footer>';if(ui.screen==='catalog'){updateCatalog();document.getElementById('search').addEventListener('input',e=>{ui.search=e.target.value;updateCatalog()});document.getElementById('when').addEventListener('change',e=>{ui.when=e.target.value;updateCatalog()});document.getElementById('sort').addEventListener('change',e=>{ui.sort=e.target.value;updateCatalog()})}if(ui.screen==='teacher')updateAgenda()}
function dialog(title,html){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=html;document.getElementById('dialog').showModal()}
const info={messages:['Сообщения','В рабочем приложении здесь открывается переписка. Макет не отправляет сообщения.'],teacher:['Преподаватель',name],place:['Место встречи',()=>place()+' · '+address()],payment:['Проверьте запись','Алексей · 16 октября, 11:00–12:30 МСК. Стоимость: 900 ₽. В макете платёж не выполняется.'],create:['Запланировать встречу','Проект → дата и время → центр и зал → стоимость и число мест. Здесь показан только переход к существующей форме.'],ideas:['Библиотека идей','Источник вдохновения для родителей и преподавателей. Идея не означает, что встреча уже организована.'],projects:['Мои проекты','Полный список проектов преподавателя будет использовать те же карточки и компоненты.'],meets:['Мои встречи','Предстоящие и прошедшие встречи ученика. В этом эталоне показана главная кабинета.']};
document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement){const wrapper=e.target.closest('.cover');if(wrapper){wrapper.innerHTML=fallback();wrapper.setAttribute('role','img');wrapper.setAttribute('aria-label','Обложка недоступна')}}},true);
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.screen){ui.screen=b.dataset.screen;render()}else if(b.dataset.nav){e.preventDefault();if(['catalog','student','teacher'].includes(b.dataset.nav)){ui.screen=b.dataset.nav;if(ui.state==='empty'&&ui.screen==='catalog'){ui.state='ready';document.getElementById('state-mode').value='ready'}render();if(document.getElementById('dialog').open)document.getElementById('dialog').close()}else{const entry=info[b.dataset.nav]||info.ideas;dialog(entry[0],'<p>'+escapeText(entry[1])+'</p>')}}else if(b.hasAttribute('data-project')){const p=photos.find(p=>p.id===b.dataset.project);dialog(title(p),'<p>'+escapeText(p.description)+'</p><p>'+escapeText(name())+'<br>'+escapeText(place())+'<br>'+escapeText(address())+'</p><p>'+(p.date||'Ближайшая встреча не назначена')+' · '+money(p.price)+'</p><small>Данные показаны для обсуждения интерфейса.</small>')}else if(b.dataset.info){const [heading,text]=info[b.dataset.info];dialog(heading,'<p>'+escapeText(typeof text==='function'?text():text)+'</p>')}else if(b.dataset.day){ui.day=Number(b.dataset.day);updateAgenda()}else if(b.hasAttribute('data-reset')){ui.search='';ui.when='all';document.getElementById('search').value='';updateCatalog()}else if(b.hasAttribute('data-retry')){ui.state='ready';document.getElementById('state-mode').value='ready';render()}});
document.getElementById('photo-mode').onchange=e=>{ui.photo=e.target.value;render()};document.getElementById('long-content').onchange=e=>{ui.long=e.target.checked;render()};document.getElementById('state-mode').onchange=e=>{ui.state=e.target.value;render()};document.querySelector('.close').onclick=()=>document.getElementById('dialog').close();document.getElementById('mobile-menu').onclick=()=>dialog('Разделы кабинета','<div class="mobile-nav"><button data-nav="student">Кабинет семьи</button><button data-nav="catalog">Найти проект</button><button data-nav="teacher">Расписание преподавателя</button></div>');render();
</script>
</body>
</html>
