<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantum — направление дизайна 01</title>
<style>
:root{--ink:#24312d;--muted:#63716b;--line:#e1e6df;--paper:#fff;--canvas:#f6f7f2;--orange:#ffbc52;--green:#24634d;--soft:#e9f1e9;--purple:#6541b4}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button,a,input,select{outline-offset:4px}button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:600}button:hover{border-color:#a8b4a9;background:#f3f5f0}button.primary{background:var(--orange);border-color:var(--orange)}button.primary:hover{background:#ffad2d}button.text{background:transparent;border-color:transparent;padding-left:0;color:var(--green)}h1,h2,h3,p{margin:0}h1{font-size:36px;line-height:1.2;letter-spacing:-1.2px;font-weight:650}h2{font-size:23px;line-height:1.3;letter-spacing:-.5px}h3{font-size:18px;line-height:1.35}small,.muted{color:var(--muted)}small{font-size:14px}.preview{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 26px;background:#24312d;color:white}.preview small{color:#cbd6ce}.switch{display:flex;gap:4px;flex-wrap:wrap}.switch button{font-size:14px;padding:7px 12px;background:transparent;border-color:transparent;color:#e0e8e2}.switch button[aria-pressed=true]{background:#f6f7f2;color:var(--ink)}header{height:82px;padding:0 32px;background:white;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:24px;font-weight:750;letter-spacing:-1px;display:flex;gap:10px;align-items:center}.mark{display:grid;place-items:center;background:var(--orange);height:34px;width:34px;border-radius:11px;font-size:24px}.account{display:flex;gap:16px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--green);font-size:14px;font-weight:700}.layout{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 140px)}aside{background:white;border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;gap:24px}.context{padding:0 12px}.context strong{display:block;font-size:15px}.context small{font-size:13px}nav{display:grid;gap:6px}nav button{text-align:left;background:transparent;border-color:transparent;font-weight:500;display:flex;align-items:center;gap:12px}nav button.active{background:var(--soft);color:var(--green);font-weight:650}.navicon{width:20px;text-align:center}.side-note{margin-top:auto;font-size:13px;padding:16px 12px;color:var(--muted)}main{padding:38px 40px 60px;max-width:1440px;width:100%;margin:0 auto}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-size:11px;font-weight:750;color:var(--green);margin-bottom:10px}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.heading p{margin-top:12px;max-width:680px;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.search{display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:10px;flex:1;min-width:200px;padding:0 14px}.search input{border:0;background:transparent;padding:12px 0;width:100%;min-width:0;color:var(--ink)}select{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink)}.count{font-size:14px;color:var(--muted);margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.cover{position:relative}.cover img{width:100%;aspect-ratio:1.35;object-fit:cover;display:block}.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;border-radius:6px;padding:4px 8px;background:var(--soft);color:var(--green)}.cover .tag{position:absolute;left:16px;top:16px;background:#fffdf4;color:var(--ink)}.cardbody{padding:20px}.cardbody p{font-size:14px;color:var(--muted);margin-top:10px;min-height:42px}.facts{display:grid;gap:5px;font-size:14px;margin:18px 0;color:var(--muted)}.facts strong{color:var(--ink);font-weight:600}.cardfoot{border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.price strong{display:block;font-size:20px}.price small{font-size:12px}.cardfoot button{font-size:13px;padding:9px 12px}.inspiration{display:flex;align-items:center;justify-content:space-between;gap:24px;border-top:1px solid var(--line);margin-top:34px;padding-top:26px}.inspiration p{font-size:14px;margin-top:5px;color:var(--muted)}.inspiration button{color:var(--purple);white-space:nowrap}.next{display:grid;grid-template-columns:1.6fr 1fr;border:1px solid var(--line);background:white;border-radius:18px;overflow:hidden}.next-info{padding:28px}.next img{width:100%;height:100%;object-fit:cover;max-height:370px}.next h2{font-size:28px;margin:18px 0}.time{font-size:20px;font-weight:650;margin:12px 0}.next .muted{font-size:15px}.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}.notice{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff5df;border-radius:12px;padding:18px 22px;margin:22px 0 34px}.notice small{display:block}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.mini-projects{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.mini{display:flex;align-items:center;gap:18px;background:white;border:1px solid var(--line);border-radius:14px;padding:14px}.mini img{width:90px;height:90px;object-fit:cover;border-radius:9px}.mini p{font-size:14px;color:var(--muted);margin-top:6px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:26px}.day{display:grid;gap:4px;place-items:center;padding:12px 5px;font-size:13px;background:transparent;border-color:transparent}.day strong{font-size:23px}.day[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}.dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}.schedule{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}.agenda{display:grid;gap:14px;align-content:start}.event{display:grid;grid-template-columns:80px 1fr;gap:20px;padding:22px;background:white;border:1px solid var(--line);border-radius:14px}.event-time strong{display:block;font-size:21px}.event-time small{font-size:13px}.event-title{display:flex;justify-content:space-between;gap:12px}.event p{font-size:14px;color:var(--muted);margin:8px 0 15px}.event-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}.event-bottom button{font-size:13px;padding:7px 12px}.summary{background:#edf2e9;border-radius:14px;padding:22px;align-self:start}.summary h3{margin-bottom:20px}.summary dl{margin:0}.summary dl div{display:flex;justify-content:space-between;margin-top:14px;gap:12px;font-size:14px}.summary dd{margin:0;font-weight:700}.summary p{font-size:13px;margin-top:22px;color:var(--muted)}.empty{padding:40px 0;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:18px;padding:28px;max-width:480px;width:calc(100% - 32px);color:var(--ink)}dialog::backdrop{background:#14241d66}dialog p{margin:18px 0;color:var(--muted)}dialog button{margin-top:12px}.mobile-nav{display:none}.prototype-label{font-size:12px;color:var(--muted);margin-top:28px}.hidden,[hidden]{display:none!important}@media(min-width:1600px){main{padding-left:64px;padding-right:64px}}@media(max-width:1150px){.layout{grid-template-columns:190px 1fr}main{padding:30px 24px}.cards{gap:14px}.cardbody{padding:16px}.schedule{grid-template-columns:1fr}.summary{display:none}.cardfoot{flex-wrap:wrap}}@media(max-width:850px){aside{display:none}.layout{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.preview{align-items:flex-start;flex-direction:column;gap:8px;padding:12px 18px}header{height:70px;padding:0 20px}.account small{display:none}.mobile-nav{display:block}.next{grid-template-columns:1.3fr 1fr}}@media(max-width:560px){main{padding:28px 18px 40px}h1{font-size:29px}.heading{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr}.cardbody p{min-height:0}.cardfoot{flex-wrap:nowrap}.cover img{aspect-ratio:1.6}.next{display:flex;flex-direction:column-reverse}.next img{height:180px}.next-info{padding:22px}.next h2{font-size:24px}.notice{align-items:flex-start;flex-direction:column}.mini-projects{grid-template-columns:1fr}.inspiration{align-items:flex-start;flex-direction:column}.account{gap:10px}.account button{padding:9px;font-size:13px}.event{grid-template-columns:1fr;gap:10px;padding:18px}.event-time{display:flex;align-items:baseline;gap:10px}.event-title{flex-wrap:wrap}.week{gap:1px}.day{padding:8px 2px}.day strong{font-size:20px}.switch button{font-size:12px;padding:7px 9px}.toolbar select{flex:1}.preview small{font-size:12px}.event-bottom{flex-wrap:wrap}}
@media(max-width:380px){.logo{font-size:18px;gap:6px}.mark{width:28px;height:28px}.avatar{display:none}header{padding:0 12px}.account{gap:6px}.account button{font-size:12px;padding:8px}}
</style>
</head>
<body>
<div class="preview"><div><strong>Направление 01</strong> <small>· Спокойная мастерская</small></div><div class="switch" aria-label="Экраны прототипа"><button data-screen="catalog" aria-pressed="true">Каталог</button><button data-screen="student" aria-pressed="false">Кабинет ученика</button><button data-screen="teacher" aria-pressed="false">Расписание</button></div></div>
<header><div class="logo"><span class="mark">q</span>Quantum</div><div class="account"><button class="mobile-nav" id="mobile-menu">Разделы</button><button data-modal="Сообщения" data-description="Здесь будет список диалогов с преподавателями и центрами.">Сообщения</button><small id="role-label">Кабинет семьи</small><span class="avatar">А</span></div></header>
<div class="layout"><aside><div class="context"><strong id="context-name">Алексей · ученик</strong><small id="context-sub">Семейный кабинет</small></div><nav id="navigation" aria-label="Основные разделы"></nav><div class="side-note">Учиться через увлечение.<br>Создавать своими руками.</div></aside><main id="content"></main></div>
<dialog id="detail"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><small>Демонстрационный макет. Данные и действия показаны для обсуждения дизайна.</small><br><button id="close-dialog">Закрыть</button></dialog>
<script>
const images={boat:'https://storage.yandexcloud.net/quantum-education/demo/quantum-workshops-v1/boat-1259652d16120b54.jpg',robot:'https://storage.yandexcloud.net/quantum-education/demo/quantum-workshops-v1/robot-0c3c2d2665adbef7.jpg',lantern:'https://storage.yandexcloud.net/quantum-education/demo/quantum-workshops-v1/lantern-ea7d85f4c6b52ddf.jpg'};
const projects=[{key:'boat',title:'Парусник своими руками',desc:'Соберём корпус, сошьём парус и проверим, как лодка держится на воде.',age:'8–12 лет',time:'15 октября · 11:00',price:'900 ₽',topic:'Дерево'},{key:'robot',title:'Робот с характером',desc:'Придумаем героя и научимся делать подвижные деревянные соединения.',age:'8–12 лет',time:'15 октября · 13:00',price:'1 100 ₽',topic:'Дерево'},{key:'lantern',title:'Фонарь с тёплым светом',desc:'Создадим бумажный объём и узор, который оживёт при свете.',age:'9–13 лет',time:'17 октября · 11:00',price:'800 ₽',topic:'Бумага'}];
let screen='catalog',selectedDay=15;
const content=document.getElementById('content');
function nav(){const teacher=screen==='teacher';document.getElementById('context-name').textContent=teacher?'Дмитрий · преподаватель':'Алексей · ученик';document.getElementById('context-sub').textContent=teacher?'Мастерская «Ромашка»':'Семейный кабинет';document.getElementById('role-label').textContent=teacher?'Кабинет преподавателя':'Кабинет семьи';const items=teacher?[['teacher','▦','Расписание'],['catalog','◇','Мои проекты'],['ideas','✧','Библиотека идей']]:[['student','⌂','Главная'],['meets','▦','Мои встречи'],['catalog','◇','Найти проект'],['ideas','✧','Мои идеи']];document.getElementById('navigation').innerHTML=items.map(([id,icon,label])=>`<button data-nav="${id}" class="${id===screen?'active':''}"><span class="navicon" aria-hidden="true">${icon}</span>${label}</button>`).join('')}
function card(p){return `<article class="card"><div class="cover"><img src="${images[p.key]}" alt="${p.title}"><span class="tag">${p.age}</span></div><div class="cardbody"><h3>${p.title}</h3><p>${p.desc}</p><div class="facts"><strong>${p.time}</strong><span>90 минут · центр «Ромашка»</span></div><div class="cardfoot"><div class="price"><strong>${p.price}</strong><small>за встречу</small></div><button data-project="${p.key}">Подробнее ↗</button></div></div></article>`}
function catalog(){content.innerHTML=`<div class="heading"><div><div class="eyebrow">Маленькие открытия. Настоящие проекты.</div><h1>Что создадим на этой неделе?</h1><p>Выберите занятие по интересам ребёнка. Рядом — преподаватель, понятный план и радость от результата.</p></div></div><div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" placeholder="Найти проект или увлечение" aria-label="Поиск проекта"></label><select id="topic" aria-label="Материал"><option>Все материалы</option><option>Дерево</option><option>Бумага</option></select><button id="filter">Ещё фильтры</button></div><div id="filter-panel" hidden class="toolbar"><label>Возраст <select id="age"><option>Любой</option><option>8 лет</option><option>9–12 лет</option></select></label><button id="reset">Сбросить</button></div><div class="count" id="results" aria-live="polite">3 проекта · ближайшие встречи</div><div class="cards" id="cards">${projects.map(card).join('')}</div><div class="inspiration"><div><h3>Пока не знаете, с чего начать?</h3><p>Расскажите, что нравится ребёнку. Поможем найти направление.</p></div><button data-modal="Подобрать идею" data-description="Первый вопрос: что ребёнку интереснее — мастерить, исследовать, рисовать или придумывать истории?">✧ Подобрать идею</button></div>`;document.getElementById('search').addEventListener('input',filter);document.getElementById('topic').addEventListener('change',filter);document.getElementById('age').addEventListener('change',filter);document.getElementById('filter').onclick=()=>{const panel=document.getElementById('filter-panel');panel.hidden=!panel.hidden};document.getElementById('reset').onclick=()=>{document.getElementById('search').value='';document.getElementById('topic').selectedIndex=0;document.getElementById('age').selectedIndex=0;filter()}}
function filter(){const q=document.getElementById('search').value.toLocaleLowerCase('ru');const topic=document.getElementById('topic').value;const age=document.getElementById('age').value;const rows=projects.filter(p=>(p.title+' '+p.desc).toLocaleLowerCase('ru').includes(q)&&(topic==='Все материалы'||p.topic===topic)&&(age!=='8 лет'||p.key!=='lantern'));document.getElementById('cards').innerHTML=rows.length?rows.map(card).join(''):'<p class="empty">Проекты не найдены. Попробуйте другой запрос или материал.</p>';document.getElementById('results').textContent=`Найдено: ${rows.length} · ближайшие встречи`}
function student(){content.innerHTML=`<div class="heading"><div><div class="eyebrow">Кабинет Алексея</div><h1>До нового открытия — один день</h1><p>Всё, что нужно для следующей встречи, собрано здесь.</p></div></div><section class="next"><div class="next-info"><span class="tag">Ближайшая встреча · завтра</span><h2>Парусник своими руками</h2><div class="time">15 октября, 11:00–12:30</div><p class="muted">Центр «Ромашка» · ул. Бахрушина, 121<br>Преподаватель Дмитрий А.</p><div class="actions"><button class="primary" data-project="boat">Открыть встречу</button><button data-modal="Что взять с собой" data-description="В макете здесь показана памятка преподавателя: удобная одежда, сменная обувь и бутылка воды. Материалы для проекта предоставляются на месте.">Что взять с собой</button></div></div><img src="${images.boat}" alt="Деревянный парусник"></section><div class="notice"><div><strong>Осталось оплатить встречу · 900 ₽</strong><small>Проверьте детали записи перед оплатой.</small></div><button data-modal="Детали оплаты" data-description="Парусник своими руками · 15 октября, 11:00. Участник: Алексей. Стоимость встречи: 900 ₽. В рабочем приложении здесь будет переход к оплате.">Проверить запись →</button></div><div class="section-title"><h2>Продолжаем создавать</h2><button class="text" data-nav="catalog">Найти новый проект →</button></div><div class="mini-projects">${projects.slice(1).map(p=>`<article class="mini"><img src="${images[p.key]}" alt="${p.title}"><div><h3>${p.title}</h3><p>${p.time}</p><button class="text" data-project="${p.key}">Посмотреть встречу →</button></div></article>`).join('')}</div>`}
function teacher(){content.innerHTML=`<div class="heading"><div><div class="eyebrow">Кабинет преподавателя</div><h1>Расписание</h1><p>12–18 октября 2026 · московское время</p></div><button class="primary" data-modal="Новая встреча" data-description="Порядок заполнения: выбрать проект → дату и время → центр и зал → стоимость и число мест. Перед публикацией показываем итоговую карточку встречи.">+ Запланировать встречу</button></div><div class="week" aria-label="Дни недели">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>`<button class="day" data-day="${12+i}" aria-pressed="${12+i===selectedDay}"><span>${d}</span><strong>${12+i}</strong><span class="dot" style="opacity:${[15,17].includes(12+i)?'.7':'0'}"></span></button>`).join('')}</div><div class="schedule"><section><div class="section-title"><h2 id="day-heading"></h2><small id="event-count"></small></div><div class="agenda" id="agenda"></div></section><aside class="summary"><h3>На этой неделе</h3><dl><div><dt>Встречи</dt><dd>4</dd></div><div><dt>Записей учеников</dt><dd>24</dd></div><div><dt>Часов занятий</dt><dd>6</dd></div></dl><p>Откройте встречу, чтобы проверить участников, место и готовность к занятию.</p></aside></div>`;agenda()}
function agenda(){const rows=selectedDay===15?projects.slice(0,2):selectedDay===17?[projects[2],projects[0]]:[];document.getElementById('day-heading').textContent=`${selectedDay} октября`;document.getElementById('event-count').textContent=rows.length?`${rows.length} встречи`:'Свободный день';document.getElementById('agenda').innerHTML=rows.length?rows.map((p,i)=>`<article class="event"><div class="event-time"><strong>${i?'13:00':'11:00'}</strong><small>90 минут</small></div><div><div class="event-title"><h3>${p.title}</h3><span class="tag">Опубликована</span></div><p>Центр «Ромашка» · мастерская</p><div class="event-bottom"><span>6 учеников · ${p.price} / встреча</span><button data-project="${p.key}">Открыть встречу</button></div></div></article>`).join(''):'<div class="empty">На этот день встреч пока нет. Можно запланировать занятие или оставить время для подготовки.</div>';document.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.day===selectedDay)))}
function show(title,description){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-copy').textContent=description;document.getElementById('detail').showModal()}
function render(){nav();document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===screen)));({catalog,student,teacher})[screen]();content.insertAdjacentHTML('beforeend','<p class="prototype-label">Макет для обсуждения · пример данных</p>')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){screen=b.dataset.screen;render()}else if(b.dataset.nav){if(['catalog','student','teacher'].includes(b.dataset.nav)){screen=b.dataset.nav;render()}else show(b.textContent.trim(),'В этой версии показаны три ключевых экрана. Этот раздел будет проработан после выбора общего направления.')}else if(b.dataset.project){const p=projects.find(p=>p.key===b.dataset.project);show(p.title,`${p.desc} Возраст: ${p.age}. Ближайшая встреча: ${p.time}. Длительность: 90 минут. Стоимость: ${p.price}.`)}else if(b.dataset.modal)show(b.dataset.modal,b.dataset.description);else if(b.dataset.day){selectedDay=+b.dataset.day;agenda()}});
document.getElementById('close-dialog').onclick=()=>document.getElementById('detail').close();document.getElementById('mobile-menu').onclick=()=>show('Разделы кабинета',screen==='teacher'?'Расписание · Мои проекты · Библиотека идей':'Главная · Мои встречи · Найти проект · Мои идеи');render();
</script>
</body></html>
